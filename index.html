<!-- =========================
     STRATEGY CONTROL
========================= -->

<section class="section-block" id="strategy-control">

  <div class="section-heading">
    <div>
      <div class="eyebrow">S</div>
      <h2>STRATEGY CONTROL</h2>
    </div>

    <span class="section-badge">AI MODE</span>
  </div>

  <div class="strategy-control">

    <!-- SELECTED STRATEGY CARD -->
    <button
      class="strategy-selected"
      id="strategySelected"
      type="button"
      aria-expanded="false"
      aria-controls="strategyMenu"
    >

      <div class="strategy-selected-icon" id="strategySelectedIcon">
        AI
      </div>

      <div class="strategy-selected-content">
        <span>ACTIVE STRATEGY</span>

        <strong id="strategySelectedName">
          AUTO
        </strong>

        <small id="strategySelectedDescription">
          AI chooses the strongest strategy
        </small>
      </div>

      <div class="strategy-arrow" id="strategyArrow">
        ˅
      </div>

    </button>


    <!-- EXPANDED STRATEGY OPTIONS -->
    <div
      class="strategy-menu"
      id="strategyMenu"
      hidden
    >

      <!-- AUTO -->
      <button
        class="strategy-option active"
        type="button"
        data-strategy="AUTO"
        data-description="AI chooses the strongest strategy"
        data-icon="AI"
      >

        <div class="strategy-option-icon">
          AI
        </div>

        <div class="strategy-option-content">
          <strong>AUTO</strong>
          <small>
            AI chooses the strongest strategy
          </small>
        </div>

        <div class="strategy-option-check">
          ✓
        </div>

      </button>


      <!-- MATCH -->
      <button
        class="strategy-option"
        type="button"
        data-strategy="MATCH"
        data-description="Predict the next matching digit"
        data-icon="M"
      >

        <div class="strategy-option-icon">
          M
        </div>

        <div class="strategy-option-content">
          <strong>MATCH</strong>
          <small>
            Predict the next matching digit
          </small>
        </div>

        <div class="strategy-option-check">
          ✓
        </div>

      </button>


      <!-- DIFFER -->
      <button
        class="strategy-option"
        type="button"
        data-strategy="DIFFER"
        data-description="Predict the next different digit"
        data-icon="D"
      >

        <div class="strategy-option-icon">
          D
        </div>

        <div class="strategy-option-content">
          <strong>DIFFER</strong>
          <small>
            Predict the next different digit
          </small>
        </div>

        <div class="strategy-option-check">
          ✓
        </div>

      </button>


      <!-- EVEN -->
      <button
        class="strategy-option"
        type="button"
        data-strategy="EVEN"
        data-description="Predict an even final digit"
        data-icon="E"
      >

        <div class="strategy-option-icon">
          E
        </div>

        <div class="strategy-option-content">
          <strong>EVEN</strong>
          <small>
            Predict an even final digit
          </small>
        </div>

        <div class="strategy-option-check">
          ✓
        </div>

      </button>


      <!-- ODD -->
      <button
        class="strategy-option"
        type="button"
        data-strategy="ODD"
        data-description="Predict an odd final digit"
        data-icon="O"
      >

        <div class="strategy-option-icon">
          O
        </div>

        <div class="strategy-option-content">
          <strong>ODD</strong>
          <small>
            Predict an odd final digit
          </small>
        </div>

        <div class="strategy-option-check">
          ✓
        </div>

      </button>

    </div>

  </div>

</section>
