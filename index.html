<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krishwave AI Trading Terminal</title>
  <style>
    :root {
      --bg: #050b14;
      --card: #0b1828;
      --accent: #00e5ff;
      --green: #19e68c;
      --red: #ff4f6d;
      --text: #eef8ff;
      --muted: #91a7bd;
      --line: #19334c;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
    }
    .status {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-oauth { background: var(--accent); color: #000; }
    .btn-buy { background: var(--green); color: #000; }
    .btn-sell { background: var(--red); color: #fff; }
    .btn-logout { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .price {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- Header -->
  <div class="header">
    <div class="title">KRISHWAVE AI</div>
    <div id="connectionStatus" class="status">Disconnected</div>
  </div>

  <!-- Login Section (Only shown when logged out) -->
  <div id="loginSection">
    <p style="color: var(--muted); font-size: 14px;">Connect directly using your Deriv account to enable paper or live trading.</p>
    <button class="btn btn-oauth" onclick="redirectToDerivOAuth()">Login via Deriv Account</button>
  </div>

  <!-- Dashboard Section (Shown when logged in) -->
  <div id="dashboardSection" class="hidden">
    <div class="card">
      <small style="color:var(--muted)">ACCOUNT ID</small>
      <div id="accountDisplay" style="font-weight:bold; font-size: 16px;">-</div>
      <small style="color:var(--muted); margin-top: 8px; display:block;">BALANCE</small>
      <div id="balanceDisplay" style="font-size: 20px; font-weight:bold; color: var(--green);">-</div>
    </div>

    <div class="card">
      <small style="color:var(--muted)">VOLATILITY 100 (1S) TICK</small>
      <div id="tickDisplay" class="price">0.00</div>
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn btn-buy" onclick="executeTrade('CALL')">HIGHER / RISE</button>
      <button class="btn btn-sell" onclick="executeTrade('PUT')">LOWER / FALL</button>
    </div>

    <button class="btn btn-logout" onclick="logout()" style="margin-top: 20px;">Disconnect Account</button>
  </div>

</div>

<script>
  // CONFIGURATION: Deriv App ID
  const APP_ID = '68359'; 
  
  let ws;
  let activeToken = localStorage.getItem('deriv_token');
  let activeAccount = localStorage.getItem('deriv_account');

  // 1. Check for OAuth Redirect parameters in URL
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const token1 = urlParams.get('token1');
    const acct1 = urlParams.get('acct1');

    if (token1 && acct1) {
      // Save credentials locally
      localStorage.setItem('deriv_token', token1);
      localStorage.setItem('deriv_account', acct1);
      
      // Clean URL params
      window.history.replaceState({}, document.title, window.location.pathname);
      
      activeToken = token1;
      activeAccount = acct1;
    }

    if (activeToken) {
      showDashboard();
      initWebSocket();
    }
  });

  // 2. Redirect user to Deriv OAuth URL
  function redirectToDerivOAuth() {
    const redirectUrl = encodeURIComponent('https://chrispusatale99-dot.github.io/KRISHWAVE/');
    const derivAuthUrl = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=en&redirect_uri=${redirectUrl}`;
    window.location.href = derivAuthUrl;
  }

  // 3. Initialize WebSocket Connection
  function initWebSocket() {
    ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

    ws.onopen = () => {
      document.getElementById('connectionStatus').innerText = 'Online';
      document.getElementById('connectionStatus').style.color = 'var(--green)';
      
      // Authorize session
      ws.send(JSON.stringify({ authorize: activeToken }));
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      // Handle Authorization Response
      if (data.msg_type === 'authorize') {
        if (data.error) {
          alert('Authentication failed: ' + data.error.message);
          logout();
          return;
        }
        document.getElementById('accountDisplay').innerText = data.authorize.loginid;
        document.getElementById('balanceDisplay').innerText = `$${parseFloat(data.authorize.balance).toFixed(2)} ${data.authorize.currency}`;
        
        // Subscribe to Volatility 100 (1s) tick data
        ws.send(JSON.stringify({ ticks: '1HZ100V' }));
      }

      // Handle Live Price Ticks
      if (data.msg_type === 'tick') {
        document.getElementById('tickDisplay').innerText = data.tick.quote;
      }

      // Handle Trade Execution Response
      if (data.msg_type === 'buy') {
        if (data.error) {
          alert('Trade Error: ' + data.error.message);
        } else {
          alert(`Trade Executed Successfully! Contract ID: ${data.buy.contract_id}`);
        }
      }
    };

    ws.onclose = () => {
      document.getElementById('connectionStatus').innerText = 'Offline';
      document.getElementById('connectionStatus').style.color = 'var(--red)';
    };
  }

  // 4. Trade Execution
  function executeTrade(type) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      alert('WebSocket is not connected.');
      return;
    }

    const tradeProposal = {
      buy: 1,
      price: 10,
      parameters: {
        amount: 10,
        basis: 'stake',
        contract_type: type,
        currency: 'USD',
        duration: 5,
        duration_unit: 't',
        symbol: '1HZ100V'
      }
    };

    ws.send(JSON.stringify(tradeProposal));
  }

  // 5. Interface toggles & Logout
  function showDashboard() {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('dashboardSection').classList.remove('hidden');
  }

  function logout() {
    localStorage.removeItem('deriv_token');
    localStorage.removeItem('deriv_account');
    window.location.reload();
  }
</script>

</body>
</html>
